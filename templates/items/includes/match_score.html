<div class="score-circle" aria-label="Match score {{ match.total_score }} percent">{{ match.total_score }}<small>%</small></div><h3 class="h5 mt-3">Match result</h3><ul class="score-list"><li><span>Category</span><strong>{{ match.category_points }}/25</strong></li><li><span>Description</span><strong>{{ match.description_points }}/25</strong></li><li><span>Colour</span><strong>{{ match.colour_points }}/20</strong></li><li><span>Location</span><strong>{{ match.location_points }}/15</strong></li><li><span>Date</span><strong>{{ match.date_points }}/15</strong></li></ul>

{% extends 'base.html' %}
{% block title %}Update report status — FindMatch{% endblock %}
{% block content %}<section class="container py-5"><div class="form-shell confirmation-shell"><div class="confirmation-icon"><i class="bi bi-patch-check"></i></div><span class="eyebrow">Confirmation</span><h1 class="h2 mt-2">Mark “{{ report.title }}” as {{ new_status }}?</h1><p class="text-secondary">This stops the report from being considered an active matching candidate.</p><form method="post" class="d-flex flex-wrap justify-content-center gap-2 mt-4">{% csrf_token %}<button class="btn {% if new_status == 'closed' %}btn-danger{% else %}btn-success{% endif %}" type="submit">Yes, mark {{ new_status }}</button><a class="btn btn-outline-secondary" href="{% url 'report_detail' report.pk %}">Cancel</a></form></div></section>{% endblock %}

{% load i18n %}
{% if international_mode_enabled %}
<form class="scope-selector" method="post" action="{% url 'switch_scope' %}" aria-label="{% translate 'Report location mode' %}">
  {% csrf_token %}
  <span class="scope-selector-label">{% translate "Mode" %}</span>
  <span class="scope-selector-buttons">
    <button class="scope-option{% if active_scope == 'university' %} active{% endif %}" type="submit" name="scope" value="university" aria-pressed="{% if active_scope == 'university' %}true{% else %}false{% endif %}">{% translate "University" %}</button>
    <button class="scope-option{% if active_scope == 'international' %} active{% endif %}" type="submit" name="scope" value="international" aria-pressed="{% if active_scope == 'international' %}true{% else %}false{% endif %}">{% translate "International" %}</button>
  </span>
</form>
{% endif %}

{% load i18n %}<form class="filter-panel admin-filter mb-4" method="get" role="search"><div class="row g-3">{% for field in form %}<div class="{{ field_col_class|default:'col-sm-6 col-xl-3' }}"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}</div>{% endfor %}<div class="col-12"><button class="btn btn-primary" type="submit"><i class="bi bi-funnel me-1"></i>{% if submit_label %}{{ submit_label }}{% else %}{% translate "Apply filters" %}{% endif %}</button> <a class="btn btn-outline-secondary" href="{{ clear_url }}">{% translate "Clear" %}</a></div></div></form>
